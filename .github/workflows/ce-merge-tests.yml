name: Merge Bot Tests
on:
  pull_request:
    paths:
      - 'scripts/ce_merge/**'
      - 'scripts/ci/**'
      - '.github/ce-merge-*.json'
      - '.github/workflows/ce-merge*.yml'
      - '.github/workflows/merge-version-tests.yml'
permissions: {}
jobs:
  demo-setup:
    if: ${{ github.repository == 'RidhaOracle/mysql-server' && github.event.pull_request.user.id == 91072007 && contains(github.event.pull_request.body, '<!-- ce-merge:demo-noop -->') }}
    name: DEMO setup (no tests)
    runs-on: ubuntu-24.04
    steps:
      - name: Report no-op demo setup
        run: echo 'DEMO ONLY - regression tests deliberately not executed' >> "$GITHUB_STEP_SUMMARY"
  test:
    if: ${{ !(github.repository == 'RidhaOracle/mysql-server' && github.event.pull_request.user.id == 91072007 && contains(github.event.pull_request.body, '<!-- ce-merge:demo-noop -->')) }}
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - run: python3 -W error::ResourceWarning -m unittest discover -s scripts/ce_merge/tests -v
