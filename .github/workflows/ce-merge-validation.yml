name: CE Merge Validation
run-name: "ce:${{ inputs.pr_number }}:${{ inputs.base_sha }}:${{ inputs.head_sha }}:${{ inputs.merge_sha }}:${{ inputs.workflow_revision }}${{ inputs.mtr_test && format(':mtr={0}', inputs.mtr_test) || '' }}"
on:
  workflow_dispatch:
    inputs:
      mtr_test:
        description: 'REHEARSAL ONLY: one main.test_name per MTR shard; empty runs full suites'
        type: string
        required: false
        default: ''
      workflow_revision:
        type: string
        required: true
      pr_number:
        type: string
        required: true
      base_sha:
        type: string
        required: true
      head_sha:
        type: string
        required: true
      candidate_repository:
        type: string
        required: true
      parents_json:
        type: string
        required: true
      merge_sha:
        type: string
        required: true
permissions: {}
# The App resolves the trusted ref and records its SHA before dispatch. No secrets,
# write tokens, persistent runners, or shared caches enter candidate execution.
jobs:
  build:
    name: build (${{ matrix.compiler }})
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        compiler: [gcc, clang]
    env:
      CC: ${{ matrix.compiler }}
      CXX: ${{ matrix.compiler == 'gcc' && 'g++' || 'clang++' }}
    steps:
      - name: Check out trusted automation
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.workflow_sha }}
          path: trusted
          persist-credentials: false
      - name: Check out candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: ${{ inputs.candidate_repository }}
          ref: ${{ inputs.merge_sha }}
          path: source
          fetch-depth: 2
          persist-credentials: false
      - name: Verify candidate
        working-directory: source
        env:
          EXPECTED_WORKFLOW: ${{ inputs.workflow_revision }}
          ACTUAL_WORKFLOW: ${{ github.workflow_sha }}
          EXPECTED_BASE: ${{ inputs.base_sha }}
          EXPECTED_PARENTS: ${{ inputs.parents_json }}
          EXPECTED_MERGE: ${{ inputs.merge_sha }}
        run: python3 ../trusted/scripts/ce_merge/verify_candidate.py
      - name: Install toolchain
        working-directory: source
        run: ../trusted/scripts/ci/bootstrap.sh
      - name: Build
        working-directory: source
        run: ../trusted/scripts/ci/build.sh debug
  mtr:
    name: mtr (${{ matrix.shard }})
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - shard: replication
            suites: binlog,binlog_gtid,binlog_nogtid,clone,federated,group_replication,rpl,rpl_gtid,rpl_nogtid
          - shard: storage
            suites: encryption,innodb,innodb_fts,innodb_gis,innodb_undo,innodb_zip,parts
          - shard: core
            suites: auth_sec,collations,component_connection_control,component_keyring_file,connection_control,funcs_2,gcol,gis,information_schema,interactive_utilities,jdv,json,main,opt_trace,query_rewrite_plugins,x
          - shard: services
            suites: perfschema,router,secondary_engine,service_status_var_registration,service_sys_var_registration,service_udf_registration,sys_vars,sysschema,test_service_sql_api,test_services
    env:
      CC: gcc
      CXX: g++
    steps:
      - name: Check out trusted automation
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.workflow_sha }}
          path: trusted
          persist-credentials: false
      - name: Check out candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: ${{ inputs.candidate_repository }}
          ref: ${{ inputs.merge_sha }}
          path: source
          fetch-depth: 2
          persist-credentials: false
      - name: Verify candidate
        working-directory: source
        env:
          EXPECTED_WORKFLOW: ${{ inputs.workflow_revision }}
          ACTUAL_WORKFLOW: ${{ github.workflow_sha }}
          EXPECTED_BASE: ${{ inputs.base_sha }}
          EXPECTED_PARENTS: ${{ inputs.parents_json }}
          EXPECTED_MERGE: ${{ inputs.merge_sha }}
        run: python3 ../trusted/scripts/ce_merge/verify_candidate.py
      - name: Verify MTR suites
        working-directory: source
        env:
          MTR_SUITES: ${{ matrix.suites }}
          CE_MTR_TEST: ${{ inputs.mtr_test }}
        run: |
          python3 ../trusted/scripts/ce_merge/verify_suites.py --suites="$MTR_SUITES"
          if [ -n "$CE_MTR_TEST" ]; then
            python3 ../trusted/scripts/ce_merge/mtr_rehearsal.py --test "$CE_MTR_TEST" --verify-only
          fi
      - name: Install toolchain
        working-directory: source
        run: ../trusted/scripts/ci/bootstrap.sh
      - name: Build
        working-directory: source
        run: ../trusted/scripts/ci/build.sh debug
      - name: Run MTR
        working-directory: source
        env:
          MTR_SUITES: ${{ matrix.suites }}
          CE_MTR_TEST: ${{ inputs.mtr_test }}
        run: |
          if [ -n "$CE_MTR_TEST" ]; then
            python3 ../trusted/scripts/ce_merge/mtr_rehearsal.py --test "$CE_MTR_TEST"
          else
            ../trusted/scripts/ci/mtr.sh --parallel=auto --force --suite="$MTR_SUITES"
          fi
      - name: Run unit tests
        if: ${{ matrix.shard == 'services' }}
        working-directory: source
        run: ctest --test-dir build --parallel "$(nproc)" --test-timeout 120 --output-on-failure --no-tests=error
  format:
    name: format
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    permissions:
      contents: read
    steps:
      - name: Check out trusted automation
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.workflow_sha }}
          path: trusted
          persist-credentials: false
      - name: Check out candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: ${{ inputs.candidate_repository }}
          ref: ${{ inputs.merge_sha }}
          path: source
          fetch-depth: 2
          persist-credentials: false
      - name: Verify candidate
        working-directory: source
        env:
          EXPECTED_WORKFLOW: ${{ inputs.workflow_revision }}
          ACTUAL_WORKFLOW: ${{ github.workflow_sha }}
          EXPECTED_BASE: ${{ inputs.base_sha }}
          EXPECTED_PARENTS: ${{ inputs.parents_json }}
          EXPECTED_MERGE: ${{ inputs.merge_sha }}
        run: python3 ../trusted/scripts/ce_merge/verify_candidate.py
      - name: Install formatter
        run: sudo apt-get update && sudo apt-get install -y clang-format-15
      - name: Check formatting
        working-directory: source
        run: python3 ../trusted/scripts/ce_merge/format_candidate.py
