name: Auto Label

# TODO: CHANGE BEFORE MERGE -> revert the trigger below to `pull_request_target`.
#
# `pull_request_target` is what the real upstream needs: it runs in the context
# of the BASE repo and hands the job a write-scoped token even for PRs opened
# from forks, so external contributors' PRs can still be labeled. It is set to
# `pull_request` here only for this fork PoC because:
#   1) a `pull_request_target` workflow must already exist on the base branch
#      (trunk) to run at all, which it does not on this very first PR; and
#   2) this PR is same-repo (head and base both on RidhaOracle/mysql-server),
#      so `pull_request` already carries a write token and can apply labels.
on: [pull_request]        # TODO: CHANGE BEFORE MERGE -> [pull_request_target]

permissions: { contents: read, pull-requests: write, issues: write }

jobs:
  label:
    runs-on: ubuntu-24.04
    steps:
      - name: Ensure labels have colors
        uses: actions/github-script@v7
        with:
          script: |
            const labels = [
              { name: 'innodb', color: '1D76DB', description: 'Changes touching InnoDB storage engine code' },
              { name: 'optimizer', color: '5319E7', description: 'Changes touching optimizer code' },
              { name: 'replication', color: '0052CC', description: 'Changes touching replication or binlog code' },
              { name: 'client', color: '0E8A16', description: 'Changes touching client or libmysql code' },
              { name: 'pluggable', color: 'FBCA04', description: 'Changes touching plugins or components' },
              { name: 'build', color: 'D93F0B', description: 'Changes touching build or GitHub automation' },
              { name: 'tests', color: 'BFDADC', description: 'Changes touching test code or test data' },
              { name: 'docs', color: '0075CA', description: 'Changes touching documentation' },
            ];

            for (const label of labels) {
              try {
                await github.rest.issues.getLabel({ ...context.repo, name: label.name });
                await github.rest.issues.updateLabel({ ...context.repo, ...label });
              } catch (error) {
                if (error.status !== 404) throw error;
                await github.rest.issues.createLabel({ ...context.repo, ...label });
              }
            }

      - uses: actions/labeler@v5
        with: { sync-labels: true }
