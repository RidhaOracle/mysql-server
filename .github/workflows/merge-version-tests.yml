name: Merge Version Tests
run-name: 'merge-test:${{ inputs.request }}'
on:
  workflow_dispatch:
    inputs:
      request:
        description: Pinned testing request ID
        required: true
        type: string
      candidate:
        description: Exact candidate commit in the public state bundle
        required: true
        type: string
      state:
        description: Exact protected state checkpoint containing the bundle
        required: true
        type: string
      bundle:
        description: Candidate bundle filename in the state checkpoint
        required: true
        type: string
      base:
        description: Exact target snapshot
        required: true
        type: string
      tree:
        description: Expected candidate file tree
        required: true
        type: string
      checks:
        description: JSON array of missing check groups
        required: true
        type: string
      suites:
        description: Version-specific JSON suite map
        required: true
        type: string
      mtr_test:
        description: Optional rehearsal test (empty means full suites)
        required: false
        default: ''
        type: string
permissions:
  contents: read
# Tests execute contributor code on separate disposable runners. The merger
# credential never enters these jobs. A pinned public state bundle supplies the
# candidate without a temporary branch. All verification scripts are trusted.
concurrency:
  group: merge-tests-${{ inputs.request }}
  cancel-in-progress: false
jobs:
  build:
    if: contains(fromJSON(inputs.checks), 'pr-build.yml')
    name: Debug build (${{ matrix.compiler }})
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    strategy:
      fail-fast: false
      matrix:
        compiler: [gcc, clang]
    env:
      CC: ${{ matrix.compiler == 'gcc' && 'gcc' || 'clang' }}
      CXX: ${{ matrix.compiler == 'gcc' && 'g++' || 'clang++' }}
    steps:
      - &checkout_candidate
        name: Check out target snapshot
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ inputs.base }}
          fetch-depth: 2
          persist-credentials: false
          path: source
      - &checkout_bundle
        name: Read public candidate bundle
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ inputs.state }}
          persist-credentials: false
          sparse-checkout: journal/bundles
          path: state
      - &checkout_automation
        name: Check out trusted automation
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          sparse-checkout: |
            scripts/ce_merge/verify_candidate.py
          sparse-checkout-cone-mode: false
          path: automation
      - &checkout_test_scripts
        name: Check out version test scripts
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ inputs.base }}
          persist-credentials: false
          sparse-checkout: scripts/ci
          path: trusted
      - &verify_candidate
        name: Verify candidate
        working-directory: source
        env:
          MERGE_REQUEST: ${{ inputs.request }}
          MERGE_CANDIDATE: ${{ inputs.candidate }}
          MERGE_BASE: ${{ inputs.base }}
          MERGE_TREE: ${{ inputs.tree }}
          MERGE_CHECKS: ${{ inputs.checks }}
          MERGE_SUITES: ${{ inputs.suites }}
          MERGE_MTR_TEST: ${{ inputs.mtr_test }}
          MERGE_STATE: ${{ inputs.state }}
          MERGE_BUNDLE: ${{ inputs.bundle }}
        run: python3 ../automation/scripts/ce_merge/verify_candidate.py
      - name: Install toolchain
        working-directory: source
        run: ../trusted/scripts/ci/bootstrap.sh
      - name: Build
        working-directory: source
        run: ../trusted/scripts/ci/build.sh debug
  mtr:
    if: contains(fromJSON(inputs.checks), 'mtr.yml')
    name: MTR (${{ matrix.shard }})
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    strategy:
      fail-fast: false
      matrix:
        shard: [replication, storage, core, services]
    env:
      CC: gcc
      CXX: g++
      MTR_SUITES: ${{ fromJSON(inputs.suites)[matrix.shard] }}
      MTR_REHEARSAL: ${{ inputs.mtr_test }}
      MTR_SHARD: ${{ matrix.shard }}
    steps:
      - *checkout_candidate
      - *checkout_bundle
      - *checkout_automation
      - *checkout_test_scripts
      - *verify_candidate
      - name: Verify MTR suites
        working-directory: source
        run: python3 ../trusted/scripts/ci/verify_suites.py --suites="$MTR_SUITES"
      - name: Install toolchain
        working-directory: source
        run: ../trusted/scripts/ci/bootstrap.sh
      - name: Build
        working-directory: source
        run: ../trusted/scripts/ci/build.sh debug
      - name: Run MTR
        if: inputs.mtr_test == ''
        working-directory: source
        run: ../trusted/scripts/ci/run_mtr.sh
      - name: Verify rehearsal test
        if: inputs.mtr_test != ''
        working-directory: source
        run: test -f "mysql-test/t/${MTR_REHEARSAL#main.}.test"
      - name: Run MTR rehearsal
        if: inputs.mtr_test != ''
        working-directory: source
        run: ../trusted/scripts/ci/mtr.sh --parallel=auto "$MTR_REHEARSAL"
      - name: Run unit tests
        if: matrix.shard == 'services'
        working-directory: source
        run: ../trusted/scripts/ci/run_unit_tests.sh
      - name: Publish test report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: merge-mtr-${{ matrix.shard }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            source/build/mysql-test/var/
            source/build/Testing/Temporary/
          if-no-files-found: ignore
          retention-days: 14
  format:
    if: contains(fromJSON(inputs.checks), 'clang-format.yml')
    name: clang-format
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - *checkout_candidate
      - *checkout_bundle
      - *checkout_automation
      - *checkout_test_scripts
      - *verify_candidate
      - name: Install clang-format
        run: sudo apt-get update && sudo apt-get install -y clang-format-15
      - name: Check formatting of changed files
        working-directory: source
        env:
          FORMAT_BASE: ${{ inputs.base }}
        run: ../trusted/scripts/ci/check_format.sh
