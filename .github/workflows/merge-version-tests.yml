name: Merge Version Tests
on:
  workflow_call:
    inputs:
      artifact:
        required: true
        type: string
      branch:
        required: true
        type: string
      candidate:
        required: true
        type: string
      base:
        required: true
        type: string
      tree:
        required: true
        type: string
      suites:
        required: true
        type: string
permissions:
  contents: read
env:
  # These disposable jobs do not restore a compiler cache. Avoid storing a
  # second copy of large debug objects beside the build itself.
  CCACHE_DISABLE: '1'
# Tests run without the merge credential on disposable runners.
jobs:
  build:
    name: Debug build (${{ matrix.compiler }})
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    strategy:
      fail-fast: false
      matrix:
        compiler: [gcc, clang]
    env:
      CC: ${{ matrix.compiler == 'gcc' && 'gcc' || 'clang' }}
      CXX: ${{ matrix.compiler == 'gcc' && 'g++' || 'clang++' }}
    steps:
      - &prepare_storage
        name: Prepare runner storage
        run: |
          test "$RUNNER_ENVIRONMENT" = github-hosted
          df -h / /tmp "$RUNNER_TEMP"
          # MySQL debug builds need the space occupied by these unused SDKs.
          sudo rm -rf -- /usr/local/lib/android /usr/share/dotnet /opt/ghc /usr/local/.ghcup
          df -h / /tmp "$RUNNER_TEMP"
      - &checkout_candidate
        name: Check out target snapshot
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ inputs.base }}
          fetch-depth: 2
          persist-credentials: false
          path: source
      - &download_candidate
        name: Download this run's prepared candidates
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          artifact-ids: ${{ inputs.artifact }}
          merge-multiple: true
          path: pipeline
      - &checkout_test_scripts
        name: Check out version test scripts
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ inputs.base }}
          persist-credentials: false
          sparse-checkout: scripts/ci
          path: trusted
      - &verify_candidate
        name: Check out the prepared candidate
        working-directory: source
        env:
          CANDIDATE: ${{ inputs.candidate }}
          BASE: ${{ inputs.base }}
          TREE: ${{ inputs.tree }}
        run: |
          python3 - <<'PYTHON'
          import json, subprocess
          from pathlib import Path
          plan = json.loads(Path('../pipeline/plan.json').read_text())
          subprocess.run(['git', '-c', 'core.hooksPath=/dev/null', 'fetch', '--no-tags',
                          'origin', *[s['base_sha'] for s in plan['steps']]], check=True)
          PYTHON
          git -c core.hooksPath=/dev/null fetch --no-tags ../pipeline/candidates.bundle 'refs/ce-candidates/*:refs/ce-candidates/*'
          test "$(git rev-parse "$CANDIDATE^{tree}")" = "$TREE"
          test "$(git rev-parse "$CANDIDATE^1")" = "$BASE"
          git -c core.hooksPath=/dev/null checkout --detach "$CANDIDATE"
      - name: Install toolchain
        working-directory: source
        run: ../trusted/scripts/ci/bootstrap.sh
      - name: Build
        working-directory: source
        run: ../trusted/scripts/ci/build.sh debug
  mtr:
    name: MTR (${{ matrix.shard }})
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    strategy:
      fail-fast: false
      matrix:
        shard: [replication, storage, core, services]
    env:
      CC: gcc
      CXX: g++
      MTR_SUITES: ${{ fromJSON(inputs.suites)[matrix.shard] }}
      MTR_SHARD: ${{ matrix.shard }}
    steps:
      - *prepare_storage
      - *checkout_candidate
      - *download_candidate
      - *checkout_test_scripts
      - *verify_candidate
      - name: Verify MTR suites
        working-directory: source
        run: python3 ../trusted/scripts/ci/verify_suites.py --suites="$MTR_SUITES"
      - name: Install toolchain
        working-directory: source
        run: ../trusted/scripts/ci/bootstrap.sh
      - name: Build
        working-directory: source
        run: ../trusted/scripts/ci/build.sh debug
      - name: Run MTR
        working-directory: source
        run: ../trusted/scripts/ci/run_mtr.sh
      - name: Run unit tests
        if: matrix.shard == 'services'
        working-directory: source
        run: ../trusted/scripts/ci/run_unit_tests.sh
      - name: Publish test report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: merge-mtr-${{ matrix.shard }}-${{ inputs.branch }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            source/build/mysql-test/var/
            source/build/Testing/Temporary/
          if-no-files-found: ignore
          retention-days: 14
  format:
    name: clang-format
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - *prepare_storage
      - *checkout_candidate
      - *download_candidate
      - *checkout_test_scripts
      - *verify_candidate
      - name: Install clang-format
        run: sudo apt-get update && sudo apt-get install -y clang-format-15
      - name: Check formatting of changed files
        working-directory: source
        env:
          FORMAT_BASE: ${{ inputs.base }}
        run: ../trusted/scripts/ci/check_format.sh
