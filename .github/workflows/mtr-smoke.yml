name: MTR Smoke
on:
  pull_request:
    branches: [trunk]
    paths-ignore: ["docs/**", "**/*.md"]

permissions:
  contents: read
  issues: write

concurrency:
  group: mtr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

# Fast, curated test signal on every PR. The full suite (innodb, replication,
# rpl, group_replication, …) runs nightly on trunk, not per-PR, to keep the
# contributor feedback loop under ~20 minutes.
jobs:
  smoke:
    runs-on: ubuntu-24.04-8core
    needs: []
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - run: scripts/dev/bootstrap.sh
      - uses: actions/cache@v4
        with:
          path: ~/.cache/mysql-boost
          key: boost-${{ hashFiles('cmake/boost.cmake') }}
      - uses: actions/cache@v4
        with:
          path: ~/.cache/ccache
          key: ccache-gcc-${{ github.sha }}
          restore-keys: ccache-gcc-
      - run: scripts/dev/build.sh debug
      - name: Run smoke suite
        run: scripts/dev/mtr.sh smoke
      - name: Publish test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mtr-smoke-logs
          path: build/mysql-test/var/log/
          retention-days: 5

  report:
    name: Label MTR result
    if: ${{ always() && !cancelled() }}
    needs: smoke
    runs-on: ubuntu-24.04
    steps:
      - name: Update MTR result label
        uses: actions/github-script@v7
        with:
          script: |
            const passed = '${{ needs.smoke.result }}' === 'success';
            const labels = [
              { name: 'MTR Passed', color: '0E8A16', description: 'MTR smoke suite passed' },
              { name: 'MTR Failed', color: 'D93F0B', description: 'MTR smoke suite failed' },
            ];

            for (const label of labels) {
              try {
                await github.rest.issues.getLabel({ ...context.repo, name: label.name });
                await github.rest.issues.updateLabel({ ...context.repo, ...label });
              } catch (error) {
                if (error.status !== 404) throw error;
                await github.rest.issues.createLabel({ ...context.repo, ...label });
              }
            }

            const selected = passed ? labels[0] : labels[1];
            const opposite = passed ? labels[1] : labels[0];
            try {
              await github.rest.issues.removeLabel({
                ...context.repo,
                issue_number: context.payload.pull_request.number,
                name: opposite.name,
              });
            } catch (error) {
              if (error.status !== 404) throw error;
            }
            await github.rest.issues.addLabels({
              ...context.repo,
              issue_number: context.payload.pull_request.number,
              labels: [selected.name],
            });
            core.info(`Set PR #${context.payload.pull_request.number} to ${selected.name}.`);
