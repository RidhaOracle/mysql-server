name: MTR
on:
  pull_request:
    branches: [trunk]
    paths-ignore: ["Docs/**", "**/*.md"]

permissions: {}

concurrency:
  group: mtr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

# Run MTR's normal default test selection on every PR.
jobs:
  mtr:
    runs-on: ubuntu-latest
    # A full default MTR selection needs substantially more time than the
    # retired smoke check. 360 minutes is GitHub-hosted runners' job maximum.
    timeout-minutes: 360
    needs: []
    permissions:
      contents: read
    steps:
      - name: Check out PR merge commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2
          persist-credentials: false
          path: source
      - name: Check out trusted CI scripts
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          fetch-depth: 1
          persist-credentials: false
          sparse-checkout: scripts/ci
          path: trusted
      - name: Verify PR merge commit
        working-directory: source
        env:
          EXPECTED_BASE: ${{ github.event.pull_request.base.sha }}
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha }}
          EXPECTED_MERGE: ${{ github.sha }}
        run: |
          test "$(git rev-parse HEAD)" = "$EXPECTED_MERGE"
          test "$(git rev-parse HEAD^1)" = "$EXPECTED_BASE"
          test "$(git rev-parse HEAD^2)" = "$EXPECTED_HEAD"
          test "$(git -C ../trusted rev-parse HEAD)" = "$EXPECTED_BASE"
      - name: Install toolchain
        working-directory: source
        run: ../trusted/scripts/ci/bootstrap.sh
      # Fork revisions can poison PR-scoped caches. Restore only for trusted,
      # same-repository branches, and never save data from this PR workflow.
      - name: Restore Boost cache
        if: ${{ github.event.pull_request.head.repo.id == github.event.repository.id }}
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/mysql-boost
          key: boost-${{ hashFiles('source/cmake/boost.cmake') }}
      - name: Restore ccache
        if: ${{ github.event.pull_request.head.repo.id == github.event.repository.id }}
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ccache
          key: ccache-gcc-${{ github.event.pull_request.head.sha }}
          restore-keys: ccache-gcc-
      - name: Build
        working-directory: source
        run: ../trusted/scripts/ci/build.sh debug
      - name: Run MTR
        working-directory: source
        run: ../trusted/scripts/ci/mtr.sh --parallel=auto
      - name: Publish test report
        if: ${{ always() && !cancelled() }}
        # The privileged reporter never downloads or executes this untrusted artifact.
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: mtr-logs-${{ github.run_id }}-${{ github.run_attempt }}
          path: source/build/mysql-test/var/log/
          retention-days: 5
