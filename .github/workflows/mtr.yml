name: MTR
on:
  pull_request:
    branches: [trunk]
    paths-ignore: ["docs/**", "**/*.md"]

permissions:
  contents: read

concurrency:
  group: mtr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

# Run MTR's normal default test selection on every PR.
jobs:
  mtr:
    runs-on: ubuntu-latest
    # A full default MTR selection needs substantially more time than the
    # retired smoke check. 360 minutes is GitHub-hosted runners' job maximum.
    timeout-minutes: 360
    needs: []
    steps:
      - uses: actions/checkout@v4
      - run: scripts/ci/bootstrap.sh
      - uses: actions/cache@v4
        with:
          path: ~/.cache/mysql-boost
          key: boost-${{ hashFiles('cmake/boost.cmake') }}
      - uses: actions/cache@v4
        with:
          path: ~/.cache/ccache
          key: ccache-gcc-${{ github.sha }}
          restore-keys: ccache-gcc-
      - run: scripts/ci/build.sh debug
      - name: Run MTR
        run: scripts/ci/mtr.sh
      - name: Publish test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mtr-logs
          path: build/mysql-test/var/log/
          retention-days: 5

  report:
    name: Label MTR result
    if: ${{ always() && !cancelled() }}
    needs: mtr
    runs-on: ubuntu-24.04
    permissions:
      issues: write
      pull-requests: write
    steps:
      - name: Update MTR result label
        uses: actions/github-script@v7
        with:
          script: |
            const passed = '${{ needs.mtr.result }}' === 'success';
            const labels = [
              { name: 'MTR Passed', color: '0E8A16', description: 'MTR suite passed' },
              { name: 'MTR Failed', color: 'D93F0B', description: 'MTR suite failed' },
            ];

            for (const label of labels) {
              try {
                await github.rest.issues.getLabel({ ...context.repo, name: label.name });
                await github.rest.issues.updateLabel({ ...context.repo, ...label });
              } catch (error) {
                if (error.status !== 404) throw error;
                await github.rest.issues.createLabel({ ...context.repo, ...label });
              }
            }

            const selected = passed ? labels[0] : labels[1];
            const opposite = passed ? labels[1] : labels[0];
            try {
              await github.rest.issues.removeLabel({
                ...context.repo,
                issue_number: context.payload.pull_request.number,
                name: opposite.name,
              });
            } catch (error) {
              if (error.status !== 404) throw error;
            }
            await github.rest.issues.addLabels({
              ...context.repo,
              issue_number: context.payload.pull_request.number,
              labels: [selected.name],
            });
            core.info(`Set PR #${context.payload.pull_request.number} to ${selected.name}.`);
