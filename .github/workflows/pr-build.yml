name: PR Build
on:
  pull_request:
    branches: [trunk]
    paths-ignore: ["docs/**", "**/*.md"]

permissions:
  contents: read

# Cancel superseded runs so a fast push doesn't queue behind a stale build.
concurrency:
  group: build-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  build:
    name: Debug build (${{ matrix.compiler }})
    runs-on: ubuntu-latest
    timeout-minutes: 360
    strategy:
      fail-fast: false
      matrix:
        compiler: [gcc, clang]
    env:
      CC: ${{ matrix.compiler == 'gcc' && 'gcc' || 'clang' }}
      CXX: ${{ matrix.compiler == 'gcc' && 'g++' || 'clang++' }}
    steps:
      - uses: actions/checkout@v4
      - name: Install toolchain
        run: scripts/dev/bootstrap.sh
      # Boost is large and version-pinned: cache it so most runs skip the download.
      - name: Cache Boost
        uses: actions/cache@v4
        with:
          path: ~/.cache/mysql-boost
          key: boost-${{ hashFiles('cmake/boost.cmake') }}
      # ccache turns the second build of a PR from ~50 min into a few minutes.
      - name: Cache ccache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ccache
          key: ccache-${{ matrix.compiler }}-${{ github.sha }}
          restore-keys: ccache-${{ matrix.compiler }}-
      - name: Show runner resources
        run: |
          echo "CPU cores: $(nproc)"
          free -h
          df -h .
      - name: Build
        run: scripts/dev/build.sh debug
      - name: Show ccache stats
        if: always()
        run: ccache --show-stats

  report:
    name: Label build result
    if: ${{ always() && !cancelled() }}
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      issues: write
      pull-requests: write
    steps:
      - name: Update build result label
        uses: actions/github-script@v7
        with:
          script: |
            const passed = '${{ needs.build.result }}' === 'success';
            const labels = [
              { name: 'Build Passed', color: '0E8A16', description: 'PR build passed' },
              { name: 'Build Failed', color: 'D93F0B', description: 'PR build failed' },
            ];

            for (const label of labels) {
              try {
                await github.rest.issues.getLabel({ ...context.repo, name: label.name });
                await github.rest.issues.updateLabel({ ...context.repo, ...label });
              } catch (error) {
                if (error.status !== 404) throw error;
                await github.rest.issues.createLabel({ ...context.repo, ...label });
              }
            }

            const selected = passed ? labels[0] : labels[1];
            const opposite = passed ? labels[1] : labels[0];
            try {
              await github.rest.issues.removeLabel({
                ...context.repo,
                issue_number: context.payload.pull_request.number,
                name: opposite.name,
              });
            } catch (error) {
              if (error.status !== 404) throw error;
            }
            await github.rest.issues.addLabels({
              ...context.repo,
              issue_number: context.payload.pull_request.number,
              labels: [selected.name],
            });
            core.info(`Set PR #${context.payload.pull_request.number} to ${selected.name}.`);
